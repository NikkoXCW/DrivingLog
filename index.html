<!DOCTYPE html>
<html>
<head>
  <title>Driving Log - Volvo BEV</title>
  <meta charset="UTF-8">
</head>
<body>
  <h2>Submit Your Info</h2>
  <form id="form">
    <label>Name (text):</label><br>
    <input type="text" name="name" required><br><br>

    <label>Birthdate (date):</label><br>
    <input type="date" name="birthdate" required><br><br>

    <label>Score (number):</label><br>
    <input type="number" name="score" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => (data[key] = value));

      status.innerText = "Submitting...";

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbwa8XFc_8QA5iG6Ll-yKMl9fIiv9SLuuVlhgTkYSmikLXeG4oFFHD7Lih0laAEp6LBv/exec", {
          method: "POST",
          body: JSON.stringify(data),
          headers: {
            "Content-Type": "application/json",
          },
        });

        const result = await response.text();
        status.innerText = "Submitted successfully!";
        form.reset();
      } catch (error) {
        status.innerText = "Submission failed. Try again.";
        console.error(error);
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Driving Log - Volvo BEV - Sutco</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      max-width: 900px;
      margin: auto;
    }
    h2, h3 {
      border-bottom: 1px solid #ccc;
      padding-bottom: 5px;
    }
    .section {
      margin-bottom: 30px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #f9f9f9;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .form-group {
      flex: 1 1 45%;
      min-width: 200px;
    }
    label {
      font-weight: bold;
    }
    input, textarea, select {
      width: 100%;
      padding: 5px;
      margin-top: 4px;
      margin-bottom: 12px;
      border: 1px solid #aaa;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #007BFF;
      border: none;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:disabled {
      background-color: #6c757d;
      cursor: not-allowed;
    }
    button:hover:not(:disabled) {
      background-color: #0056b3;
    }
    @media (max-width: 600px) {
      .form-group {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

  <h2>Driving Log Entry - Volvo BEV - Sutco</h2>
  <form id="form">

    <div class="section">
      <h3>Trip Overview</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Date:</label>
          <input type="date" name="Date" required>
        </div>
        <div class="form-group">
          <label>Driver Name:</label>
          <input type="text" name="driverName" required>
        </div>
        <div class="form-group">
          <label>Vehicle:</label>
          <input type="text" name="vehicle" required>
        </div>
        <div class="form-group">
          <label>Route:</label>
          <input type="text" name="route" required>
        </div>
        <div class="form-group">
          <label>Road Conditions:</label>
          <input type="text" name="roadConditions">
        </div>
        <div class="form-group">
          <label>Distance Travelled (km):</label>
          <input type="number" name="distanceTravelled" min="0" step="0.1">
        </div>
        <div class="form-group">
          <label>Trailer Type:</label>
          <input type="text" name="trailerType">
        </div>
        <div class="form-group">
          <label>Cargo Weight (kg):</label>
          <input type="number" name="cargoWeight" min="0" step="1">
        </div>
        <div class="form-group" style="flex: 1 1 100%;">
          <label>Cargo Description:</label>
          <input type="text" name="cargoDescription">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Trip Start</h3>
      <div class="form-row">
        <div class="form-group">
          <label>Start Temp (°C):</label>
          <input type="number" name="startTemp">
        </div>
        <div class="form-group">
          <label>Start Time:</label>
          <input type="time" name="startTime">
        </div>
        <div class="form-group">
          <label>Start Odometer (km):</label>
          <input type="number" name="startOdometer" min="0" step="1">
        </div>
        <div class="form-group">
          <label>Start Battery SoC (%):</label>
          <input type="number" name="startSoc" min="0" max="100" step="1">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Trip End</h3>
      <div class="form-row">
        <div class="form-group">
          <label>End Temp (°C):</label>
          <input type="number" name="endTemp">
        </div>
        <div class="form-group">
          <label>End Time:</label>
          <input type="time" name="endTime">
        </div>
        <div class="form-group">
          <label>End Odometer (km):</label>
          <input type="number" name="endOdometer" min="0" step="1">
        </div>
        <div class="form-group">
          <label>End Battery SoC (%):</label>
          <input type="number" name="endSoc" min="0" max="100" step="1">
        </div>
      </div>
    </div>

    <div class="section">
      <h3>Notes</h3>
      <label>Additional Notes:</label>
      <textarea name="notes" rows="5" placeholder="Anything to add..."></textarea>
    </div>

    <input type="hidden" name="submissionTimestamp" id="submissionTimestamp">
    <button type="submit">Submit</button>
  </form>

  <script>
    const form = document.getElementById("form");
    const STORAGE_KEY = "drivingLogFormData_Sutco";

    // 1. Restore saved data on page load
    window.addEventListener("DOMContentLoaded", () => {
      const savedData = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      for (const [key, value] of Object.entries(savedData)) {
        const field = form.elements[key];
        if (field) field.value = value;
      }
    });
  
    // 2. Save form inputs on change
    form.addEventListener("input", () => {
      const formData = new FormData(form);
      const data = {};
      for (const [key, value] of formData.entries()) {
        data[key] = value;
      }
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    });
  
    // 3. Handle form submission
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
  
      const confirmSubmit = window.confirm("Are you sure you want to submit this driving log?");
      if (!confirmSubmit) return;

      document.getElementById("submissionTimestamp").value = new Date().toISOString();

      const formData = new FormData(form);
      const params = new URLSearchParams();
      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      const submitBtn = form.querySelector("button");
      submitBtn.disabled = true;

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbzHah5k1dNfYPGEgy3gIKGgp3AvH2ycJAUaXjlAzgEe7NxYOWRLZDKeT0CBwfp8d9o/exec", {
          method: "POST",
          body: params
        });

        const text = await response.text();
        console.log("Response:", text);
        alert("Submitted successfully!\n\nResponse:\n" + text);

        form.reset();
        document.getElementById("submissionTimestamp").value = "";
        localStorage.removeItem(STORAGE_KEY);
      } catch (error) {
        console.error("Submission error:", error);
        alert("Submission failed. Please try again.\n\nError:\n" + error.message);
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>

</body>
</html>

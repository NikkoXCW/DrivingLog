<!DOCTYPE html>
<html>
<head>
  <title>Driving Log - Volvo BEV</title>
  <meta charset="UTF-8">
</head>
<body>
  <h2>Submit Your Info</h2>
  <form id="form">
    <label>Name (text):</label><br>
    <input type="text" name="name" required><br><br>

    <label>Birthdate (date):</label><br>
    <input type="date" name="birthdate" required><br><br>

    <label>Score (number):</label><br>
    <input type="number" name="score" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const data = {};
      formData.forEach((value, key) => (data[key] = value));

      console.log("Sending data:", data);

      status.innerText = "Submitting...";

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbzqW0oJGfvk_ovaCqtPI66_mIkMZkXbjkLFiy62YWYJUfqV1P_19x-6wdSDXfl4C1bG/exec", {
          method: "POST",
          body: JSON.stringify(data),
          headers: {
            "Content-Type": "application/json",
          },
        });

        const result = await response.text();
        console.log("Response from server:", result);
        
        if (response.ok && result.includes("Success")) {
          status.innerText = "Submitted successfully!";
          form.reset();
        } else {
          throw new Error(result);
        }
      } catch (error) {
        status.innerText = "Submission failed. See console for error.";
        console.error("Error:", error.message);
      }
    });
  </script>
</body>
</html>

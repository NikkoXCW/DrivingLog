<!DOCTYPE html>
<html>
<head>
  <title>Driving Log - Volvo BEV</title>
  <meta charset="UTF-8">
</head>
<body>
  <h2>Submit Your Info</h2>
  <form id="form">
    <label>Name (text):</label><br>
    <input type="text" name="name" required><br><br>

    <label>Birthdate (date):</label><br>
    <input type="date" name="birthdate" required><br><br>

    <label>Score (number):</label><br>
    <input type="number" name="score" required><br><br>

    <button type="submit">Submit</button>
  </form>

  <p id="status"></p>

  <script>
    const form = document.getElementById("form");
    const status = document.getElementById("status");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(form);
      const params = new URLSearchParams(); // ✅ make sure this line exists!

      for (const [key, value] of formData.entries()) {
        params.append(key, value);
      }

      status.innerText = "Submitting...";

      try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbwn_yHiWpPmGeduqg4AMvhPpWCy1W_1Jh3L397J81NtIkLIjZ4nVvYfVU-DU3gIDjtr/exec", {
          method: "POST",
          body: params,
        });

        const text = await response.text();
        console.log("Response:", text);
        status.innerText = "Submitted successfully!";
        form.reset();
      } catch (error) {
        console.error("Submission error:", error);
        status.innerText = "Submission failed.";
      }
    });
  </script>
</body>
</html>
